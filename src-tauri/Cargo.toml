[package]
name = "auto-video"
version = "0.1.0"
description = "auto-video desktop app"
authors = ["plushie"]
edition = "2021"

[lib]
name = "auto_video_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
librqbit = "8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync"] }
anyhow = "1"
